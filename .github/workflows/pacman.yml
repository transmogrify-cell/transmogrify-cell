name: generate pacman contribution graph

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Writes dist/pacman-contribution-graph.svg and -dark.svg
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # games: pacman, breakout, galaga, puzzle-bobble, bomberman, minesweeper
          games: "pacman"
          # opportunistic | conservative | aggressive
          player_style: "opportunistic"
          hide_month_labels: "false"

      # Publishes everything in dist/ to the `output` branch, which the README reads
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
