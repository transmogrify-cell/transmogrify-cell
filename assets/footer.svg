    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="15s" repeatCount="indefinite"/>
      <path d="M0 120 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0 V 190 H0 Z" fill="url(#fg-w7C5)" fill-opacity="0.5"/>
      <path d="M0 120 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0 q 125 20 250 0 q 125 -20 250 0" fill="none" stroke="#7C5CFF" stroke-opacity="0.55" stroke-width="1.6"/>
    </g>
