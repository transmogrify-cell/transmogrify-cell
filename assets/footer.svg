<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 190" width="1000" height="190" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Thanks for stopping by</title>
  <defs>
    <linearGradient id="fg-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/><stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="fg-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="fg-w7C5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.85"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="fg-w22D" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.8"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="fg-wF47" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F472B6" stop-opacity="0.75"/><stop offset="1" stop-color="#F472B6" stop-opacity="0.06"/>
    </linearGradient>
    <clipPath id="fc-card"><rect x="1" y="1" width="998" height="188" rx="26"/></clipPath>
    <style>
