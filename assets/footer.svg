      <path d="M0 138 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0 V 190 H0 Z" fill="url(#fg-w22D)" fill-opacity="0.45"/>
      <path d="M0 138 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0 q 125 15 250 0 q 125 -15 250 0" fill="none" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.6"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="27s" repeatCount="indefinite"/>
      <path d="M0 156 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0 V 190 H0 Z" fill="url(#fg-wF47)" fill-opacity="0.4"/>
      <path d="M0 156 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0 q 125 11 250 0 q 125 -11 250 0" fill="none" stroke="#F472B6" stroke-opacity="0.55" stroke-width="1.6"/>
    </g>
    <text x="500" y="60" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#93A0C0">
      <tspan fill="#34D399">$</tspan> git commit -m <tspan fill="#22D3EE">&quot;let&#39;s build something great&quot;</tspan><tspan class="caret" fill="#E8ECF8">&#9608;</tspan>
    </text>
    <text class="glowtext" x="500" y="96" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E8ECF8" letter-spacing="0.4">Thanks for stopping by &#8212; happy shipping!</text>
