<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 18" width="1000" height="18" role="img" aria-label="divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
