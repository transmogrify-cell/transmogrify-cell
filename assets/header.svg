<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Himanshu Chandela — Software Engineer and Competitive Programmer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Himanshu Chandela — Software Engineer · Competitive Programmer</title>
  <defs>
    <linearGradient id="hg-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="hg-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="0.35" stop-color="#7C5CFF"/>
      <stop offset="0.7" stop-color="#F472B6"/><stop offset="1" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-0.45 0;0.45 0;-0.45 0" dur="9s" repeatCount="indefinite"
        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    </linearGradient>
    <linearGradient id="hg-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hg-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hg-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F472B6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hg-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="hf-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <pattern id="hp-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="hc-card"><rect x="1" y="1" width="998" height="298" rx="26"/></clipPath>
    <clipPath id="hc-name"><text x="90" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">Himanshu Chandela</text></clipPath>
    <style>
      .pt { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
      @keyframes rise {
        0%   { transform: translateY(0px);    opacity: 0; }
        12%  { opacity: 0.9; }
        80%  { opacity: 0.55; }
        100% { transform: translateY(-260px); opacity: 0; }
      }
      .chip { animation: fadein 1s ease-out both; }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      .dot { animation: blink 3.4s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }
      .cursor { animation: caret 1.1s steps(1) infinite; }
      @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#hc-card)">
    <rect width="1000" height="300" fill="url(#hg-shell)"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;90 40;0 0"
        dur="16s" begin="0s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      <ellipse cx="180" cy="70" rx="240" ry="150" fill="#7C5CFF" opacity="0.55" filter="url(#hf-soft)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-110 -50;0 0"
        dur="19s" begin="-3s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      <ellipse cx="690" cy="250" rx="300" ry="170" fill="#22D3EE" opacity="0.42" filter="url(#hf-soft)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-70 70;0 0"
        dur="21s" begin="-6s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      <ellipse cx="880" cy="40" rx="210" ry="130" fill="#F472B6" opacity="0.36" filter="url(#hf-soft)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;60 -60;0 0"
        dur="23s" begin="-9s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      <ellipse cx="430" cy="300" rx="260" ry="140" fill="#34D399" opacity="0.22" filter="url(#hf-soft)"/>
    </g>
    <rect width="1000" height="300" fill="url(#hp-grid)"/>
    <rect width="1000" height="300" fill="#080B14" opacity="0.42"/>

    <rect width="1000" height="120" fill="url(#hg-gloss)"/>

    <!-- window chrome -->
    <rect x="0" y="0" width="1000" height="46" fill="#ffffff" fill-opacity="0.04"/>
    <line x1="0" y1="46" x2="1000" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle class="dot" cx="30" cy="23" r="5.5" fill="#F472B6"/>
    <circle class="dot" cx="50" cy="23" r="5.5" fill="#FBBF24" style="animation-delay:-1.1s"/>
    <circle class="dot" cx="70" cy="23" r="5.5" fill="#34D399" style="animation-delay:-2.2s"/>
    <rect x="386" y="12" width="228" height="23" rx="11.5" fill="#ffffff" fill-opacity="0.05"/>
    <text x="500" y="28" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#93A0C0" letter-spacing="0.6">github.com/transmogrify-cell</text>

    <!-- greeting -->
    <text x="90" y="104" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#22D3EE" letter-spacing="3.4">HELLO WORLD, I&#39;M</text>

    <!-- name + flowing gradient + shine sweep -->
    <text x="90" y="152" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2" fill="url(#hg-name)">Himanshu Chandela</text>
    <g clip-path="url(#hc-name)">
      <rect x="-260" y="100" width="150" height="80" fill="url(#hg-shine)" opacity="0.5" transform="skewX(-18)">
        <animate attributeName="x" values="-260;1060" dur="6.5s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="90" y="166" width="300" height="1.6" fill="url(#hg-rule)"/>

    <!-- tagline -->
    <text x="90" y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" fill="#93A0C0">
      Turning caffeine into algorithms &#183; Knight @ LeetCode &#183; Specialist @ Codeforces<tspan class="cursor" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" fill="#22D3EE" font-size="16"> &#9608;</tspan>
    </text>

    <g class="chip">
      <rect x="90" y="206" width="173" height="30" rx="15" fill="rgba(255,255,255,0.055)" stroke="#7C5CFF" stroke-opacity="0.45"/>
      <circle cx="105" cy="221" r="3.2" fill="#7C5CFF"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="117" y="225" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#E8ECF8" fill-opacity="0.88" letter-spacing="0.2">Software Engineer</text>
    </g>
    <g class="chip">
      <rect x="276" y="206" width="211" height="30" rx="15" fill="rgba(255,255,255,0.055)" stroke="#22D3EE" stroke-opacity="0.45"/>
      <circle cx="291" cy="221" r="3.2" fill="#22D3EE"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="303" y="225" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#E8ECF8" fill-opacity="0.88" letter-spacing="0.2">Competitive Programmer</text>
    </g>
    <g class="chip">
      <rect x="500" y="206" width="143" height="30" rx="15" fill="rgba(255,255,255,0.055)" stroke="#F472B6" stroke-opacity="0.45"/>
      <circle cx="515" cy="221" r="3.2" fill="#F472B6"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="527" y="225" font-family="'JetBrains Mono','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace" font-size="12.5" fill="#E8ECF8" fill-opacity="0.88" letter-spacing="0.2">Deep Learning</text>
    </g>
    <circle class="pt" cx="95" cy="290" r="1.8" fill="#22D3EE" style="animation-duration:11s;animation-delay:-0.0s"/>
    <circle class="pt" cx="168" cy="290" r="1.3" fill="#7C5CFF" style="animation-duration:14s;animation-delay:-2.4s"/>
    <circle class="pt" cx="260" cy="290" r="2.1" fill="#F472B6" style="animation-duration:12.5s;animation-delay:-1.1s"/>
    <circle class="pt" cx="347" cy="290" r="1.4" fill="#22D3EE" style="animation-duration:15s;animation-delay:-4.2s"/>
    <circle class="pt" cx="430" cy="290" r="1.7" fill="#34D399" style="animation-duration:13s;animation-delay:-3.0s"/>
    <circle class="pt" cx="566" cy="290" r="1.5" fill="#7C5CFF" style="animation-duration:16s;animation-delay:-0.6s"/>
    <circle class="pt" cx="648" cy="290" r="2.0" fill="#22D3EE" style="animation-duration:12s;animation-delay:-5.1s"/>
    <circle class="pt" cx="735" cy="290" r="1.3" fill="#F472B6" style="animation-duration:14.5s;animation-delay:-2.0s"/>
    <circle class="pt" cx="812" cy="290" r="1.8" fill="#5B8DEF" style="animation-duration:13.5s;animation-delay:-3.8s"/>
    <circle class="pt" cx="905" cy="290" r="1.5" fill="#22D3EE" style="animation-duration:11.5s;animation-delay:-1.6s"/>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="26" fill="none" stroke="url(#hg-edge)" stroke-width="1.4"/>
</svg>
